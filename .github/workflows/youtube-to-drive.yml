name: YouTube to Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

concurrency:
  group: youtube-to-drive-vpn-isolated
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        worker: [0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install OpenVPN with a hard timeout
        run: |
          timeout 90s sudo apt-get update
          timeout 90s sudo apt-get install -y --no-install-recommends openvpn
      - run: pip install -r requirements.txt
      - name: Download and upload authorized videos
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_SHEET_ID: ${{ secrets.YOUTUBE_SHEET_ID }}
          YOUTUBE_ROOT_FOLDER_ID: ${{ secrets.YOUTUBE_ROOT_FOLDER_ID }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          PROTON_OPENVPN_USERNAME: ${{ secrets.PROTON_OPENVPN_USERNAME }}
          PROTON_OPENVPN_PASSWORD: ${{ secrets.PROTON_OPENVPN_PASSWORD }}
          PROTON_OPENVPN_CONFIG_B64: ${{ secrets.PROTON_OPENVPN_CONFIG_B64 }}
          YOUTUBE_SHEET_NAME: LINK YOUTUBE
          VPNBOOK_ENABLED: 0
          WORKER_INDEX: ${{ matrix.worker }}
          WORKER_COUNT: 1
          MAX_VIDEOS: 10
        run: python worker.py
